services:
  db:
    image: mysql:8.4
    container_name: dpb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpb-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      APP_URL: ${APP_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      DISPLAY_TOKEN_SECRET: ${DISPLAY_TOKEN_SECRET}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE}
      DISPLAY_MODE: ${DISPLAY_MODE:-pages}
      DISPLAY_ROTATE_SECONDS: ${DISPLAY_ROTATE_SECONDS:-10}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD}
      SEED_DISPLAY_TOKEN: ${SEED_DISPLAY_TOKEN}
      SEED: ${SEED:-0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data: